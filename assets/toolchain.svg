<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <defs>
    <linearGradient id="toolBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6">
        <animate attributeName="stop-color" values="#c084fc;#f472b6;#38bdf8;#c084fc" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#f472b6" stop-opacity="0.3">
        <animate attributeName="stop-color" values="#f472b6;#38bdf8;#c084fc;#f472b6" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6">
        <animate attributeName="stop-color" values="#38bdf8;#c084fc;#f472b6;#38bdf8" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <style>
    .layer-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; }
    .tech-list { font-family: 'Fira Code', monospace; font-size: 11px; fill: #cbd5e1; }
  </style>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="846" height="246" rx="14" fill="#131322" stroke="url(#toolBorder)" stroke-width="1.2" />

  <!-- Row 1: ML & Perception -->
  <g transform="translate(24, 18)">
    <text x="0" y="22" class="layer-title" fill="#c084fc">Machine Learning &amp; Perception</text>
    <text x="260" y="22" class="tech-list">PyTorch, TensorFlow / Keras, OpenCV, MediaPipe, Scikit-Learn, Librosa</text>
    <line x1="0" y1="36" x2="802" y2="36" stroke="#334155" stroke-opacity="0.4" stroke-width="1" />
  </g>

  <!-- Row 2: Agentic Orchestration -->
  <g transform="translate(24, 64)">
    <text x="0" y="22" class="layer-title" fill="#f472b6">Agentic Orchestration &amp; LLMs</text>
    <text x="260" y="22" class="tech-list">LangGraph, LangChain, Tool Calling, Pydantic Guardrails, OpenAI, Gemini</text>
    <line x1="0" y1="36" x2="802" y2="36" stroke="#334155" stroke-opacity="0.4" stroke-width="1" />
  </g>

  <!-- Row 3: Backend & API -->
  <g transform="translate(24, 110)">
    <text x="0" y="22" class="layer-title" fill="#38bdf8">Backend &amp; API Engineering</text>
    <text x="260" y="22" class="tech-list">Python, FastAPI, Uvicorn, RESTful Services, Asynchronous Pipelines</text>
    <line x1="0" y1="36" x2="802" y2="36" stroke="#334155" stroke-opacity="0.4" stroke-width="1" />
  </g>

  <!-- Row 4: Data Engineering -->
  <g transform="translate(24, 156)">
    <text x="0" y="22" class="layer-title" fill="#34d399">Data Engineering &amp; Storage</text>
    <text x="260" y="22" class="tech-list">DuckDB, MongoDB, PostgreSQL, Stratified Sampling, Feature Scaling</text>
    <line x1="0" y1="36" x2="802" y2="36" stroke="#334155" stroke-opacity="0.4" stroke-width="1" />
  </g>

  <!-- Row 5: Environment -->
  <g transform="translate(24, 202)">
    <text x="0" y="22" class="layer-title" fill="#a5b4fc">Environment &amp; Collaboration</text>
    <text x="260" y="22" class="tech-list">Docker, Git / GitHub, Google Colab, Linux CLI, Jupyter, Figma</text>
  </g>
</svg>

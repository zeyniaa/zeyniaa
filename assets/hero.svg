<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 310" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161324" />
      <stop offset="50%" stop-color="#10111d" />
      <stop offset="100%" stop-color="#0c1322" />
    </linearGradient>

    <!-- Border Gradient with Subtle Animation -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#f472b6;#38bdf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#38bdf8;#c084fc;#f472b6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#c084fc;#f472b6;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subheading {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif;
      font-size: 15.5px;
      font-weight: 600;
      fill: #f1f5f9;
      letter-spacing: -0.2px;
    }
    .description {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 400;
      fill: #cbd5e1;
    }
    .pill-text {
      font-family: 'Fira Code', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
    }
    .quote {
      font-family: 'Fira Code', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      font-weight: 400;
      fill: #64748b;
    }
    .motion-text {
      font-family: 'Fira Code', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 500;
    }

    /* Motion Animations */
    @keyframes cycle1 {
      0%, 28% { opacity: 1; }
      33%, 100% { opacity: 0; }
    }
    @keyframes cycle2 {
      0%, 30% { opacity: 0; }
      35%, 61% { opacity: 1; }
      66%, 100% { opacity: 0; }
    }
    @keyframes cycle3 {
      0%, 63% { opacity: 0; }
      68%, 95% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.30; }
    }

    .c1 { animation: cycle1 9s infinite; }
    .c2 { animation: cycle2 9s infinite; }
    .c3 { animation: cycle3 9s infinite; }
    .cursor { animation: cursorBlink 0.9s infinite; }
    .glow-orb { animation: pulseGlow 4s ease-in-out infinite alternate; }
  </style>

  <!-- Ambient Pulsing Glow Orbs -->
  <circle cx="140" cy="65" r="115" fill="#a855f7" class="glow-orb" filter="url(#blur)" />
  <circle cx="710" cy="245" r="115" fill="#ec4899" class="glow-orb" filter="url(#blur)" />

  <!-- Outer Card Frame with Dynamic Animated Gradient Border -->
  <rect x="2" y="2" width="846" height="306" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Title: I'm Zeiniah -->
  <text x="425" y="66" text-anchor="middle" class="title">
    <tspan fill="#ffffff">I'm </tspan>
    <tspan fill="url(#titleGrad)">Zeiniah</tspan>
  </text>

  <!-- Subheading -->
  <text x="425" y="102" text-anchor="middle" class="subheading">
    AI Engineer • Agentic Workflows • Perception &amp; Vision Systems
  </text>

  <!-- Description -->
  <text x="425" y="130" text-anchor="middle" class="description">
    Bridging algorithmic machine learning research with resilient software engineering
  </text>
  <text x="425" y="150" text-anchor="middle" class="description">
    to build autonomous, human-centric intelligent systems.
  </text>

  <!-- ANIMATED MOTION TYPEWRITER SECTION -->
  <g transform="translate(425, 180)">
    <!-- Cycle 1 -->
    <text x="0" y="0" text-anchor="middle" class="motion-text c1" fill="#c084fc">
      &gt; Architecting Autonomous Agents &amp; Decision Pipelines
      <tspan class="cursor" fill="#f472b6">|</tspan>
    </text>
    <!-- Cycle 2 -->
    <text x="0" y="0" text-anchor="middle" class="motion-text c2" fill="#f472b6">
      &gt; Temporal Computer Vision &amp; Sequence Modeling
      <tspan class="cursor" fill="#c084fc">|</tspan>
    </text>
    <!-- Cycle 3 -->
    <text x="0" y="0" text-anchor="middle" class="motion-text c3" fill="#38bdf8">
      &gt; Acoustic Signal Intelligence &amp; Production Backends
      <tspan class="cursor" fill="#34d399">|</tspan>
    </text>
  </g>

  <!-- Pill Badges (Categorized Engineering Pillars) -->
  <g transform="translate(235, 206)">
    <!-- Pill 1: Autonomous Agents -->
    <g transform="translate(0, 0)">
      <rect width="180" height="26" rx="13" fill="#2e1065" fill-opacity="0.85" stroke="#a855f7" stroke-opacity="0.6" stroke-width="1" />
      <text x="90" y="17" text-anchor="middle" class="pill-text" fill="#e9d5ff">Autonomous Agents</text>
    </g>
    <!-- Pill 2: Computer Vision & DL -->
    <g transform="translate(195, 0)">
      <rect width="185" height="26" rx="13" fill="#4c0519" fill-opacity="0.85" stroke="#f43f5e" stroke-opacity="0.5" stroke-width="1" />
      <text x="92.5" y="17" text-anchor="middle" class="pill-text" fill="#ffe4e6">Computer Vision &amp; DL</text>
    </g>
  </g>

  <g transform="translate(210, 240)">
    <!-- Pill 3: Acoustic Signal AI -->
    <g transform="translate(0, 0)">
      <rect width="185" height="26" rx="13" fill="#082f49" fill-opacity="0.85" stroke="#0284c7" stroke-opacity="0.5" stroke-width="1" />
      <text x="92.5" y="17" text-anchor="middle" class="pill-text" fill="#bae6fd">Acoustic Signal AI</text>
    </g>
    <!-- Pill 4: End-to-End AI Backends -->
    <g transform="translate(200, 0)">
      <rect width="215" height="26" rx="13" fill="#022c22" fill-opacity="0.85" stroke="#10b981" stroke-opacity="0.5" stroke-width="1" />
      <text x="107.5" y="17" text-anchor="middle" class="pill-text" fill="#a7f3d0">End-to-End AI Backends</text>
    </g>
  </g>

  <!-- Bottom Quote -->
  <text x="425" y="292" text-anchor="middle" class="quote">
    Translating mathematical models into dependable production software.
  </text>
</svg>

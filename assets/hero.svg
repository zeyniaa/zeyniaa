<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 310" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181528" />
      <stop offset="50%" stop-color="#12131f" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#f472b6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subheading {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif;
      font-size: 16px;
      font-weight: 600;
      fill: #f1f5f9;
      letter-spacing: -0.2px;
    }
    .description {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 400;
      fill: #cbd5e1;
    }
    .pill-text {
      font-family: 'Fira Code', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
    }
    .quote {
      font-family: 'Fira Code', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      font-weight: 400;
      fill: #64748b;
    }
  </style>

  <!-- Ambient Glow Orbs -->
  <circle cx="140" cy="60" r="100" fill="#a855f7" opacity="0.18" filter="url(#blur)" />
  <circle cx="710" cy="250" r="110" fill="#ec4899" opacity="0.16" filter="url(#blur)" />

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="846" height="306" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Title: I'm Zeiniah -->
  <text x="425" y="62" text-anchor="middle" class="title">
    <tspan fill="#ffffff">I'm </tspan>
    <tspan fill="url(#titleGrad)">Zeiniah</tspan>
  </text>

  <!-- Subheading -->
  <text x="425" y="98" text-anchor="middle" class="subheading">
    AI Engineer • Agentic Workflows • Perception &amp; Vision Systems
  </text>

  <!-- Description -->
  <text x="425" y="128" text-anchor="middle" class="description">
    Bridging algorithmic machine learning research with resilient software engineering
  </text>
  <text x="425" y="148" text-anchor="middle" class="description">
    to build autonomous, human-centric intelligent systems.
  </text>

  <!-- Pill Badges Layout (Exact to Preview Mockup) -->
  <!-- Row 1: Autonomous Agents -->
  <g transform="translate(345, 170)">
    <rect width="160" height="26" rx="13" fill="#2e1065" fill-opacity="0.8" stroke="#a855f7" stroke-opacity="0.6" stroke-width="1" />
    <text x="80" y="17" text-anchor="middle" class="pill-text" fill="#e9d5ff">Autonomous Agents</text>
  </g>

  <!-- Row 2: Computer Vision & Sequence Modeling -->
  <g transform="translate(275, 204)">
    <rect width="300" height="26" rx="13" fill="#4c0519" fill-opacity="0.8" stroke="#f43f5e" stroke-opacity="0.5" stroke-width="1" />
    <text x="150" y="17" text-anchor="middle" class="pill-text" fill="#ffe4e6">Computer Vision &amp; Sequence Modeling</text>
  </g>

  <!-- Row 3: Acoustic Signal AI & End-to-End AI Backends -->
  <g transform="translate(235, 238)">
    <rect width="175" height="26" rx="13" fill="#082f49" fill-opacity="0.8" stroke="#0284c7" stroke-opacity="0.5" stroke-width="1" />
    <text x="87" y="17" text-anchor="middle" class="pill-text" fill="#bae6fd">Acoustic Signal AI</text>
  </g>

  <g transform="translate(425, 238)">
    <rect width="190" height="26" rx="13" fill="#022c22" fill-opacity="0.8" stroke="#10b981" stroke-opacity="0.5" stroke-width="1" />
    <text x="95" y="17" text-anchor="middle" class="pill-text" fill="#a7f3d0">End-to-End AI Backends</text>
  </g>

  <!-- Bottom Quote -->
  <text x="425" y="292" text-anchor="middle" class="quote">
    Translating mathematical models into dependable production software.
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 144" width="100%" height="100%">
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; font-weight: 700; }
    .body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; line-height: 1.5; fill: #94a3b8; }
  </style>

  <!-- Card 1 -->
  <g transform="translate(0, 0)">
    <rect x="2" y="2" width="418" height="138" rx="14" fill="#171226" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.2" />
    <text x="18" y="28" class="title" fill="#c084fc">GDGoC UIN Jakarta • Co-Lead</text>
    <text x="18" y="52" class="body">
      <tspan x="18" dy="0">Spearheaded the chapter to become the #1 Most Active</tspan>
      <tspan x="18" dy="17">&amp; Most Impactful Chapter in Indonesia, executing 55+</tspan>
      <tspan x="18" dy="17">technical sessions across AI, Web, and Cloud for 500+</tspan>
      <tspan x="18" dy="17">student members (93% retention rate).</tspan>
    </text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(430, 0)">
    <rect x="2" y="2" width="418" height="138" rx="14" fill="#20101c" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1.2" />
    <text x="18" y="28" class="title" fill="#fb7185">Young On Top Jakarta • Head Division Tech</text>
    <text x="18" y="52" class="body">
      <tspan x="18" dy="0">Directed a technology division of 30+ members, organized</tspan>
      <tspan x="18" dy="17">national-scale tech competitions with 500+ participants,</tspan>
      <tspan x="18" dy="17">and hosted Indonesia's largest youth summit as Master of</tspan>
      <tspan x="18" dy="17">Ceremonies (YOTNC 2024).</tspan>
    </text>
  </g>
</svg>
